name: Release

# ----------------------------------------------------------
# Berechtigungen nach Least-Privilege-Prinzip
#
# contents:
#   Lesen des Repositorys
#
# packages:
#   Veröffentlichung von Container Images nach GHCR
# ----------------------------------------------------------

permissions:
  contents: read
  packages: write

# ----------------------------------------------------------
# Workflow Trigger
#
# Release erfolgt nach erfolgreichem Push auf main.
# Dieser Release-Workflow ist ausschließlich für den main Branch
# vorgesehen (kein Push-Trigger für Feature-Branches).
#
# Feature-Branches bewusst NICHT im push-Trigger: Code auf ihnen
# ist noch nicht abgeschlossen/reviewed. Ein Release (inkl. Push
# des Images nach GHCR) soll nur aus main erfolgen, damit keine
# unfertigen Stände veröffentlicht werden.
#
# Zusätzlich kann der Release manuell gestartet werden (z. B. um
# testweise ein Image von einem anderen Branch zu bauen).
# ----------------------------------------------------------

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  release:
    name: Build Security Scan and Release

    runs-on: ubuntu-latest

    # ----------------------------------------------------------
    # Zentrale Variablen für den Image-Namen und die Version.
    #
    # Dadurch steht "pacman-app" nur an dieser einen Stelle im
    # Workflow — alle folgenden Steps verwenden $IMAGE_NAME statt
    # den Pfad jedes Mal erneut auszuschreiben. Das verhindert
    # Tippfehler und doppelte/abweichende Image-Namen.
    #
    # RELEASE_TAG wird bei einer neuen Version einfach hier
    # angepasst, statt an mehreren Stellen im Workflow.
    # ----------------------------------------------------------
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}

      RELEASE_TAG: v1.0.0

    steps:
      # --------------------------------------------------
      # 1. Repository Checkout
      # --------------------------------------------------

      - name: Repository auschecken

        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Docker Image bauen
      #
      # Zwei Tags werden erzeugt:
      #
      # 1. Commit SHA
      #    eindeutige technische Referenz
      #
      # 2. Release Tag
      #    nachvollziehbare Version
      # --------------------------------------------------

      - name: Docker Image erstellen

        run: |

          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:$RELEASE_TAG .

      # --------------------------------------------------
      # 3. Security Scan mit Trivy
      #
      # Scan erfolgt VOR Veröffentlichung.
      #
      # Bei HIGH oder CRITICAL Findings
      # wird die Pipeline abgebrochen.
      # --------------------------------------------------

      - name: Security Scan Docker Image

        uses: aquasecurity/trivy-action@v0.36.0

        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}

          format: table

          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      # --------------------------------------------------
      # 4. Login bei GitHub Container Registry
      #
      # GITHUB_TOKEN wird automatisch
      # durch GitHub Actions bereitgestellt.
      #
      # Kein persönlicher Token erforderlich.
      # --------------------------------------------------

      - name: Login GHCR

        uses: docker/login-action@v3

        with:
          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 5. Docker Images nach GHCR pushen
      #
      # Beide Tags werden veröffentlicht:
      #
      # - Commit SHA
      # - Release Version
      # --------------------------------------------------

      - name: Image nach GHCR pushen

        run: |


          docker push \
            $IMAGE_NAME:${{ github.sha }}


          docker push \
            $IMAGE_NAME:$RELEASE_TAG

      # --------------------------------------------------
      # 6. Registry Digest anzeigen
      #
      # Nachweis welches Image tatsächlich
      # veröffentlicht wurde.
      # --------------------------------------------------

      - name: Image Digest anzeigen

        run: |


          echo "Veröffentlichtes Image:"


          echo $IMAGE_NAME:$RELEASE_TAG


          docker pull \
            $IMAGE_NAME:$RELEASE_TAG


          docker inspect \
            --format='{{index .RepoDigests 0}}' \
            $IMAGE_NAME:$RELEASE_TAG

      # --------------------------------------------------
      # 7. GitOps Repository auschecken
      #
      # Nur wenn dieser Lauf tatsaechlich von main stammt. Bei einem
      # workflow_dispatch von einem Feature-Branch soll zwar weiterhin
      # gebaut/gescannt/gepusht werden (bestehendes Verhalten), aber
      # KEIN GitOps-Update ausgeloest werden.
      #
      # GITOPS_TOKEN ist ein separates Actions-Secret (siehe Doku),
      # da der Standard-GITHUB_TOKEN nur Zugriff auf DIESES Repository
      # (pacman-app) hat, nicht auf pacman-gitops.
      # --------------------------------------------------

      - name: GitOps Repository auschecken

        if: github.ref == 'refs/heads/main'

        uses: actions/checkout@v4

        with:
          repository: isangare-ux/pacman-gitops

          ref: main

          path: pacman-gitops

          token: ${{ secrets.GITOPS_TOKEN }}

      # --------------------------------------------------
      # 8. Kustomize installieren
      #
      # Fest gepinnte Version (keine "latest"-Installation), damit das
      # Rendering-Verhalten reproduzierbar bleibt. Aktuell v5.7.1 - bei
      # Bedarf hier bewusst und dokumentiert anheben.
      # --------------------------------------------------

      - name: Kustomize installieren (fest gepinnte Version v5.7.1)

        if: github.ref == 'refs/heads/main'

        env:
          KUSTOMIZE_VERSION: v5.7.1

        run: |

          curl -sfLo kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/kustomize
          rm kustomize.tar.gz
          kustomize version

      # --------------------------------------------------
      # 9. Dev-Image auf den soeben veroeffentlichten Commit-SHA-Tag
      #    setzen
      #
      # "kustomize edit set image" ergaenzt/aktualisiert den
      # images:-Block robust ueber die Kustomize-API, statt fragil per
      # sed einen (im Dev-Overlay noch gar nicht vorhandenen) newTag zu
      # ersetzen.
      # --------------------------------------------------

      - name: Dev-Image auf Commit-SHA setzen

        if: github.ref == 'refs/heads/main'

        working-directory: pacman-gitops/apps/pacman/overlays/dev

        run: |

          kustomize edit set image \
            $IMAGE_NAME=$IMAGE_NAME:${{ github.sha }}

      # --------------------------------------------------
      # 10. Dev-Overlay validieren
      #
      # Schlaegt der Kustomize-Build fehl, bricht dieser Step (und damit
      # der gesamte Workflow) automatisch mit Fehler ab - es wird kein
      # ungueltiger Stand committet.
      # --------------------------------------------------

      - name: Dev-Overlay validieren

        if: github.ref == 'refs/heads/main'

        working-directory: pacman-gitops

        run: |

          kustomize build apps/pacman/overlays/dev > /dev/null

      # --------------------------------------------------
      # 11. Aenderungsumfang pruefen
      #
      # Zwei Sicherheitsnetze:
      # - Prod (apps/pacman/overlays/prod/) darf durch diesen Workflow
      #   NIEMALS veraendert werden.
      # - Es darf ausschliesslich die Dev-Overlay-kustomization.yaml
      #   veraendert worden sein, keine weitere Datei.
      # --------------------------------------------------

      - name: Aenderungsumfang pruefen (nur Dev, Prod unveraendert)

        if: github.ref == 'refs/heads/main'

        working-directory: pacman-gitops

        run: |

          if [ -n "$(git diff --name-only -- apps/pacman/overlays/prod/)" ]; then
            echo "FEHLER: apps/pacman/overlays/prod/ wurde veraendert - das ist nicht erlaubt." >&2
            git diff --stat -- apps/pacman/overlays/prod/
            exit 1
          fi

          CHANGED_FILES="$(git diff --name-only)"
          EXPECTED_FILE="apps/pacman/overlays/dev/kustomization.yaml"

          if [ -n "$CHANGED_FILES" ] && [ "$CHANGED_FILES" != "$EXPECTED_FILE" ]; then
            echo "FEHLER: unerwartete Dateien wurden veraendert:" >&2
            echo "$CHANGED_FILES" >&2
            exit 1
          fi

          echo "Aenderungsumfang OK: Prod unveraendert, nur $EXPECTED_FILE betroffen (falls ueberhaupt eine Aenderung)."

          echo "--- Dev-Diff ---"
          git diff -- "$EXPECTED_FILE"

      # --------------------------------------------------
      # 12. GitOps Commit erstellen
      #
      # Verwendet die uebliche github-actions[bot]-Identitaet. Falls das
      # Dev-Overlay bereits exakt diesen Commit-SHA-Tag traegt (z. B. bei
      # einem erneuten manuellen Lauf), wird bewusst KEIN leerer Commit
      # erzeugt, sondern nur eine verstaendliche Meldung ausgegeben.
      # --------------------------------------------------

      - name: GitOps Commit erstellen

        if: github.ref == 'refs/heads/main'

        id: gitops_commit

        working-directory: pacman-gitops

        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps/pacman/overlays/dev/kustomization.yaml

          if git diff --cached --quiet; then
            echo "Dev-Overlay verwendet bereits den Commit-SHA-Tag ${{ github.sha }} - kein neuer Commit noetig."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: Dev-Image auf Commit-SHA aktualisieren (${{ github.sha }})"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # --------------------------------------------------
      # 13. GitOps Commit pushen
      #
      # Nur wenn Schritt 12 tatsaechlich einen neuen Commit erzeugt hat.
      # Kein Force-Push.
      # --------------------------------------------------

      - name: GitOps Commit pushen

        if: github.ref == 'refs/heads/main' && steps.gitops_commit.outputs.committed == 'true'

        working-directory: pacman-gitops

        run: |

          git push origin main

      # --------------------------------------------------
      # 14. Release erfolgreich
      # --------------------------------------------------

      - name: Release erfolgreich abgeschlossen

        run: |


          echo "================================="
          echo "GHCR Release erfolgreich"
          echo "Image:"
          echo "$IMAGE_NAME:${{ github.sha }}"
          echo "$IMAGE_NAME:$RELEASE_TAG"
          echo "Commit:"
          echo "${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "GitOps Dev-Overlay wurde aktualisiert (pacman-gitops, apps/pacman/overlays/dev)."
          else
            echo "GitOps-Update uebersprungen (kein Lauf auf main, sondern manueller Dispatch von einem anderen Ref)."
          fi
          echo "================================="
