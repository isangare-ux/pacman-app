# ----------------------------------------------------------
# CI-Pipeline für die Pacman-App
#
# Installiert Abhängigkeiten, führt die vorhandenen Tests aus und baut
# anschließend ein Docker-Image, um die Buildfähigkeit sicherzustellen.
#
# Es erfolgt KEINE Veröffentlichung nach GHCR. Das Image wird ausschließlich
# lokal auf dem Runner gebaut und danach verworfen. Die Veröffentlichung
# eines Release-Images ist Aufgabe des separaten release.yml-Workflows,
# der ausschließlich aus main ausgelöst wird.
# ----------------------------------------------------------

name: CI Pipeline

# ----------------------------------------------------------
# Berechtigungen nach Least-Privilege-Prinzip
#
# contents:
#   Lesen des Repositorys (Checkout).
#
# Kein "packages: write", da dieser Workflow keine Images veröffentlicht.
# ----------------------------------------------------------
permissions:
  contents: read

# ----------------------------------------------------------
# Workflow Trigger
#
# push:
#   Läuft bei jedem Push auf main, develop und alle Feature-Branches
#   (feature/**, z. B. feature/login). Dadurch wird jeder Code-Stand
#   frühzeitig gebaut und getestet, unabhängig davon, ob bereits ein
#   Pull Request existiert.
#
# pull_request:
#   Läuft zusätzlich bei jedem Pull Request nach main, damit der
#   Merge-Kandidat selbst (inklusive eines eventuellen Merge-Commits)
#   geprüft wird, bevor gemergt werden darf.
#
# Hinweis: Ein Push auf einen Feature-Branch mit bereits offenem PR nach
# main löst den Workflow dadurch zweimal aus (push + pull_request
# synchronize für denselben Commit). Das ist bewusst in Kauf genommen,
# um sowohl den reinen Branch-Stand als auch den PR-Kontext abzudecken.
# ----------------------------------------------------------
on:
  push:
    branches:
      - main
      - develop
      - feature/** # alle Feature-Branches (z. B. feature/login)

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    # ----------------------------------------------------------
    # MongoDB als Service-Container für den späteren HTTP-Smoke-Test
    # (Schritt 8). Läuft ohne Authentifizierung - die Pacman-Anwendung
    # baut ihre Verbindungs-Zugangsdaten nur, wenn MONGO_AUTH_USER UND
    # MONGO_AUTH_PWD gesetzt sind (siehe lib/config.js); beide werden im
    # Smoke-Test-Schritt bewusst nicht gesetzt.
    #
    # Ohne "container:" für den Job selbst ist der Service unter
    # localhost:27017 auf dem Runner erreichbar.
    # ----------------------------------------------------------
    services:
      mongodb:
        image: mongo:4.4.30-focal
        ports:
          - 27017:27017

    steps:

      # --------------------------------------------------
      # 1. Repository Checkout
      #
      # Holt den Quellcode des Repositories in die Runner-Umgebung,
      # da alle nachfolgenden Schritte (npm, docker build, ...) auf
      # dem Dateisystem des Runners arbeiten.
      # --------------------------------------------------
      - name: Repository auschecken
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Node.js-Umgebung einrichten
      #
      # Feste Node-Version (16.19.0), passend zur verbindlichen
      # Projektbasis, damit Build und Tests reproduzierbar auf
      # derselben Laufzeitversion ausgeführt werden wie lokal/produktiv.
      # --------------------------------------------------
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "16.19.0"

      # Dient als Nachweis in den Workflow-Logs, welche Node-Version
      # tatsächlich verwendet wurde (Debugging/Nachvollziehbarkeit).
      - name: Node-Version anzeigen
        run: node --version

      # --------------------------------------------------
      # 3. Abhängigkeiten installieren
      #
      # "npm ci" statt "npm install": installiert exakt die in
      # package-lock.json fixierten Versionen und bricht ab, falls
      # package.json und package-lock.json nicht übereinstimmen.
      # Dadurch reproduzierbare, deterministische Installationen.
      # --------------------------------------------------
      - name: Abhängigkeiten installieren
        run: npm ci

      # --------------------------------------------------
      # 4. Tests ausführen
      #
      # Führt die vorhandene Testsuite aus. Schlägt ein Test fehl,
      # bricht "npm test" mit einem Exit-Code ungleich 0 ab und damit
      # automatisch auch dieser Workflow-Schritt - alle nachfolgenden
      # Schritte (inklusive Docker-Build) werden dann nicht ausgeführt.
      #
      # Ausgabe wird zusätzlich in eine Log-Datei gespiegelt (tee), die
      # am Ende des Workflows als Artefakt hochgeladen wird (Schritt 11).
      # "set -o pipefail" sorgt dafür, dass ein fehlgeschlagener Test
      # trotz der Pipe zu "tee" weiterhin diesen Schritt fehlschlagen
      # lässt.
      # --------------------------------------------------
      - name: Tests ausführen
        run: |
          set -o pipefail
          mkdir -p logs
          npm test 2>&1 | tee logs/npm-test.log

      # --------------------------------------------------
      # 5. Docker Compose validieren
      #
      # Prüft die docker-compose-Konfiguration rein syntaktisch
      # ("config --quiet" rendert die Datei, ohne Container zu starten).
      # Fängt fehlerhafte Compose-Dateien frühzeitig ab, bevor sie in
      # der lokalen Entwicklung oder im Betrieb Probleme verursachen.
      # --------------------------------------------------
      - name: Docker Compose validieren
        run: docker compose config --quiet

      # --------------------------------------------------
      # 6. GitOps-Overlays validieren
      #
      # Rendert Dev- und Prod-Overlay aus dem separaten pacman-gitops-
      # Repository mit Kustomize. Ein fehlerhaftes YAML (z. B. defekter
      # Patch, falsche Referenz) lässt "kustomize build" fehlschlagen
      # und bricht damit automatisch auch diesen Workflow-Schritt ab.
      #
      # Feste Kustomize-Version wie in release.yml, damit das
      # Rendering-Verhalten reproduzierbar bleibt.
      # --------------------------------------------------
      - name: pacman-gitops auschecken (nur lesend, zur Validierung)
        uses: actions/checkout@v4
        with:
          repository: isangare-ux/pacman-gitops
          ref: main
          path: pacman-gitops-check

      - name: Kustomize installieren (fest gepinnte Version v5.7.1)
        env:
          KUSTOMIZE_VERSION: v5.7.1
        run: |
          curl -sfLo kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/kustomize
          rm kustomize.tar.gz
          kustomize version

      - name: Dev- und Prod-Overlay rendern
        working-directory: pacman-gitops-check
        run: |
          echo "--- Dev-Overlay ---"
          kustomize build apps/pacman/overlays/dev > /dev/null
          echo "OK: Dev-Overlay gültig."

          echo "--- Prod-Overlay ---"
          kustomize build apps/pacman/overlays/prod > /dev/null
          echo "OK: Prod-Overlay gültig."

      # --------------------------------------------------
      # 7. Docker Buildx einrichten
      #
      # Buildx wird als Docker-Build-Backend benötigt, u. a. für
      # erweitertes Caching und konsistentes Build-Verhalten zwischen
      # lokaler Umgebung und GitHub-Actions-Runner.
      # --------------------------------------------------
      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # 8. Docker Image bauen (nur lokal)
      #
      # Baut das Image ausschließlich auf dem Runner, um die
      # Buildfähigkeit des Dockerfiles sicherzustellen. Es erfolgt
      # bewusst KEIN Login bei GHCR und KEIN Push in eine Registry -
      # das ist Aufgabe des separaten release.yml-Workflows.
      # --------------------------------------------------
      - name: Docker Image erstellen
        run: |
          docker build \
            -t pacman-app:${{ github.sha }} .

      # --------------------------------------------------
      # 9. HTTP-Smoke-Test gegen den laufenden Container
      #
      # Startet das eben gebaute Image mit "--network host", damit der
      # Container sowohl den MongoDB-Service (localhost:27017) erreicht
      # als auch selbst über localhost:8080 ansprechbar ist. Geprüft
      # werden die Startseite (statischer Endpunkt) und
      # /highscores/list (datenbankabhängiger Endpunkt, siehe
      # Aufgabenstellung Abschnitt 13).
      # --------------------------------------------------
      - name: Container für Smoke-Test starten
        run: |
          docker run -d \
            --name pacman-smoke-test \
            --network host \
            -e MONGO_SERVICE_HOST=localhost \
            -e MONGO_DATABASE=pacman \
            -e MY_MONGO_PORT=27017 \
            pacman-app:${{ github.sha }}

      - name: Auf Bereitschaft warten
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "OK: Anwendung ist erreichbar."
              exit 0
            fi
            sleep 1
          done
          echo "FEHLER: Anwendung wurde innerhalb von 30s nicht bereit." >&2
          docker logs pacman-smoke-test
          exit 1

      - name: Smoke-Test ausführen
        run: |
          set -o pipefail
          mkdir -p logs
          {
            echo "--- Startseite ---"
            curl -sf http://localhost:8080/ > /dev/null && echo "OK: HTTP 200 auf /"

            echo "--- Datenbankabhängiger Endpunkt ---"
            curl -sf http://localhost:8080/highscores/list > /dev/null && echo "OK: HTTP 200 auf /highscores/list"
          } 2>&1 | tee logs/smoke-test.log

      - name: Smoke-Test-Container aufräumen
        if: always()
        run: |
          mkdir -p logs
          docker logs pacman-smoke-test > logs/pacman-container.log 2>&1 || true
          docker rm -f pacman-smoke-test || true

      # --------------------------------------------------
      # 10. Testlogs als Workflow-Artefakt hochladen
      #
      # Lädt die Logs aus den Schritten 4 und 9 hoch (auch bei
      # fehlgeschlagenem Lauf, damit die Ursache nachvollziehbar
      # bleibt). Enthält ausschließlich npm-/curl-/Container-Ausgaben -
      # keine Tokens, Kennwörter oder Secret-Werte, da an keiner Stelle
      # dieses Workflows Zugangsdaten in Logs ausgegeben werden.
      # --------------------------------------------------
      - name: Testlogs als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.sha }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14

      # --------------------------------------------------
      # 11. Abschlussmeldung
      #
      # Dient als klar erkennbarer, erfolgreicher Abschluss der
      # Pipeline in den Workflow-Logs.
      # --------------------------------------------------
      - name: Workflow erfolgreich abgeschlossen
        run: echo "CI Pipeline erfolgreich ausgeführt."
