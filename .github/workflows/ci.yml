# ==========================================================
# CI-Pipeline für die Pacman-App
#
# Ablauf:
# 1. Repository auschecken
# 2. Node.js Umgebung vorbereiten inklusive npm Cache
# 3. Abhängigkeiten installieren
# 4. Docker Compose validieren
# 5. Docker Compose Integrationsumgebung starten
# 6. Smoke-Test durchführen (tests/smoke-test.sh)
# 7. Anwendungstests ausführen
# 8. Testlogs speichern
# 9. Umgebung bereinigen (scripts/local-stop.sh)
# 10. Docker Image bauen
# 11. Image nach GHCR veröffentlichen
#
# Hinweis:
# Die CI-Pipeline startet die Docker-Compose-Umgebung.
# Der Smoke-Test prüft anschließend die laufende Anwendung
# und validiert die MongoDB-Kommunikation.
# ==========================================================


name: CI Pipeline


# Least-Privilege-Prinzip:
# Repository lesen und Docker Images in GHCR veröffentlichen
permissions:
  contents: read
  packages: write



on:
  push:
    branches:
      - main
      - develop
      - feature/**

  pull_request:
    branches:
      - main



jobs:

  build-test:

    name: Build and Test
    runs-on: ubuntu-latest


    steps:


      # --------------------------------------------------
      # 1. Repository auschecken
      # --------------------------------------------------
      - name: Repository auschecken
        uses: actions/checkout@v4



      # --------------------------------------------------
      # 2. Node.js Umgebung vorbereiten
      # --------------------------------------------------
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          # Node.js 18 ist erforderlich, da Jest os.availableParallelism()
          # verwendet, das erst ab Node.js 18.14 verfügbar ist.
          node-version: "18"
          cache: npm



      - name: Node Version prüfen
        run: node --version



      # --------------------------------------------------
      # 3. Abhängigkeiten installieren
      # --------------------------------------------------
      - name: Abhängigkeiten installieren
        run: npm ci



      # --------------------------------------------------
      # 4. Docker Compose validieren
      # --------------------------------------------------
      # Prüft YAML-Struktur und aufgelöste Konfiguration.
      - name: Docker Compose validieren
        run: docker compose config



      # --------------------------------------------------
      # 5. Docker Compose Umgebung starten
      # --------------------------------------------------
      # NEU AP13:
      # Startet die Integrationsumgebung innerhalb der CI.
      #
      # Services:
      # - Pacman Anwendung
      # - MongoDB Datenbank
      - name: Docker Compose Stack starten
        run: docker compose up -d



      # --------------------------------------------------
      # 6. Smoke-Test durchführen
      # --------------------------------------------------
      # Prüft die laufende Integrationsumgebung:
      #
      # - HTTP-Erreichbarkeit
      # - MongoDB Schreibprüfung
      # - MongoDB Leseprüfung
      #
      # Der Start der Container erfolgt bereits oben.
      - name: Smoke Test durchführen
        run: ./tests/smoke-test.sh



      # --------------------------------------------------
      # 7. Anwendungstests
      # --------------------------------------------------
      - name: Tests ausführen
        env:
          # localhost:27017 funktioniert, weil compose.yaml Port 27017 auf den Host freigibt.
          # Der Hostname "mongodb" wäre nur innerhalb des Docker-Netzwerks erreichbar,
          # aber npm test läuft auf dem Host-Runner, nicht im Container.
          MONGO_URL: mongodb://localhost:27017
        run: |
          # Erstellt ein Verzeichnis für Testprotokolle.
          # Die Logs werden anschließend als GitHub Actions Artifact gespeichert.
          mkdir -p logs

          # Führt die automatisierten Jest-Tests aus.
          #
          # Ausgeführt werden:
          # - tests/app.test.js       → Prüfung der HTTP-Erreichbarkeit der Anwendung
          # - tests/mongodb.test.js   → Prüfung der MongoDB-Verbindung
          #
          # 2>&1:
          # - leitet die Standardfehlerausgabe (stderr)
          #   in die Standardausgabe (stdout) um.
          # - dadurch werden normale Ausgaben und Fehlermeldungen
          #   gemeinsam im Log gespeichert.
          #
          # | tee logs/test.log:
          # - schreibt die komplette Testausgabe in die Datei test.log.
          # - gleichzeitig bleibt die Ausgabe im GitHub Actions Terminal sichtbar.
          npm test -- tests/basic.test.js tests/app.test.js tests/mongodb.test.js 2>&1 | tee logs/test.log

          # PIPESTATUS[0]:
          # - enthält den ursprünglichen Exit-Code des npm test Befehls.
          #
          # Problem ohne diese Zeile:
          # Durch "tee" würde der Exit-Code von tee übernommen werden.
          # Auch bei fehlgeschlagenen Tests könnte die Pipeline erfolgreich erscheinen.
          #
          # Exit-Code:
          # 0 = Tests erfolgreich
          # != 0 = Testfehler → CI Pipeline schlägt fehl
          exit ${PIPESTATUS[0]}



      # --------------------------------------------------
      # 8. Testlogs als Artefakt speichern
      # --------------------------------------------------
      - name: Testlogs speichern
        # if: always() stellt sicher, dass die Testlogs auch dann gespeichert
        # werden, wenn ein vorheriger Schritt fehlgeschlagen ist.
        # Ohne diese Zeile würde GitHub Actions den Schritt überspringen,
        # sobald z.B. die Tests fehlschlagen — die Logs wären dann verloren
        # und eine Fehleranalyse wäre nicht möglich.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          if-no-files-found: ignore



      # --------------------------------------------------
      # 9. Docker Compose Umgebung stoppen
      # --------------------------------------------------
      - name: Docker Compose stoppen
        # if: always() stellt sicher, dass die Docker Compose Umgebung auch dann
        # gestoppt und bereinigt wird, wenn ein vorheriger Schritt fehlgeschlagen ist.
        # Ohne diese Zeile würden Container nach einem Fehler weiterlaufen
        # und Ressourcen im GitHub Actions Runner belegen.
        if: always()
        run: ./scripts/local-stop.sh



      # --------------------------------------------------
      # 10. Docker Image bauen
      # --------------------------------------------------
      - name: Docker Image erstellen
        run: |
          docker build \
            -t pacman-app:${{ github.sha }} \
            -t pacman-app:latest .



      # --------------------------------------------------
      # 11. GHCR Login
      # --------------------------------------------------
      - name: Login bei GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}



      # --------------------------------------------------
      # 12. Docker Image veröffentlichen
      # --------------------------------------------------
      - name: Image nach GHCR pushen
        run: |
          docker tag pacman-app:${{ github.sha }} \
          ghcr.io/${{ github.repository }}/pacman-app:${{ github.sha }}

          docker push \
          ghcr.io/${{ github.repository }}/pacman-app:${{ github.sha }}



      # --------------------------------------------------
      # Abschluss
      # --------------------------------------------------
      - name: CI erfolgreich abgeschlossen
        run: echo "CI Pipeline erfolgreich ausgeführt."