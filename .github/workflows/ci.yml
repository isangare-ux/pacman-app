# ==========================================================
# CI-Pipeline für die Pacman-App
#
# Ablauf:
# 1. Repository auschecken
# 2. Node.js Umgebung vorbereiten inklusive npm Cache
# 3. Abhängigkeiten installieren
# 4. Docker Compose validieren
# 5. Docker Compose Integrationsumgebung starten
# 6. Healthcheck der Services prüfen
# 7. Smoke-Test durchführen (tests/smoke-test.sh)
# 8. Anwendungstests ausführen
# 9. Testlogs speichern
# 10. Umgebung bereinigen (scripts/local-stop.sh)
# 11. Docker Image bauen
# 12. Image nach GHCR veröffentlichen
#
# Hinweis:
# Die CI-Pipeline startet die Docker-Compose-Umgebung.
# Der Smoke-Test prüft anschließend die laufende Anwendung
# und validiert die MongoDB-Kommunikation.
# ==========================================================


name: CI Pipeline


# Least-Privilege-Prinzip:
# Repository lesen und Docker Images in GHCR veröffentlichen
permissions:
  contents: read
  packages: write



on:
  push:
    branches:
      - main
      - develop
      - feature/**

  pull_request:
    branches:
      - main



jobs:

  build-test:

    name: Build and Test
    runs-on: ubuntu-latest


    steps:


      # --------------------------------------------------
      # 1. Repository auschecken
      # --------------------------------------------------
      - name: Repository auschecken
        uses: actions/checkout@v4



      # --------------------------------------------------
      # 2. Node.js Umgebung vorbereiten
      # --------------------------------------------------
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "16.19.0"
          cache: npm



      - name: Node Version prüfen
        run: node --version



      # --------------------------------------------------
      # 3. Abhängigkeiten installieren
      # --------------------------------------------------
      - name: Abhängigkeiten installieren
        run: npm ci



      # --------------------------------------------------
      # 4. Docker Compose validieren
      # --------------------------------------------------
      # Prüft YAML-Struktur und aufgelöste Konfiguration.
      - name: Docker Compose validieren
        run: docker compose config



      # --------------------------------------------------
      # 5. Docker Compose Umgebung starten
      # --------------------------------------------------
      # NEU AP13:
      # Startet die Integrationsumgebung innerhalb der CI.
      #
      # Services:
      # - Pacman Anwendung
      # - MongoDB Datenbank
      - name: Docker Compose Stack starten
        run: docker compose up -d



      # --------------------------------------------------
      # 6. Healthcheck Status prüfen
      # --------------------------------------------------
      # NEU AP13:
      # Wartet aktiv auf den erfolgreichen Start der Services.
      #
      # Eine feste Wartezeit wird vermieden.
      # Die Pipeline wartet maximal 60 Sekunden.
      - name: Auf Services warten
        run: |
          echo "Warte auf gestartete Services..."

          timeout 60 bash -c '
          until docker compose ps | grep -q "pacman.*healthy" &&
                docker compose ps | grep -q "mongodb.*healthy"; do

            echo "Services noch nicht bereit..."
            sleep 5

          done
          '

          docker compose ps



      # --------------------------------------------------
      # 7. Smoke-Test durchführen
      # --------------------------------------------------
      # Prüft die laufende Integrationsumgebung:
      #
      # - HTTP-Erreichbarkeit
      # - MongoDB Schreibprüfung
      # - MongoDB Leseprüfung
      #
      # Der Start der Container erfolgt bereits oben.
      - name: Smoke Test durchführen
        run: ./tests/smoke-test.sh



      # --------------------------------------------------
      # 8. Anwendungstests
      # --------------------------------------------------
      - name: Tests ausführen
        run: |
          mkdir -p logs

          npm test 2>&1 | tee logs/test.log

          # Übergibt den ursprünglichen Exit-Code von npm test.
          exit ${PIPESTATUS[0]}



      # --------------------------------------------------
      # 9. Testlogs als Artefakt speichern
      # --------------------------------------------------
      - name: Testlogs speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: logs/
          if-no-files-found: ignore



      # --------------------------------------------------
      # 10. Docker Compose Umgebung stoppen
      # --------------------------------------------------
      # always():
      # Cleanup erfolgt auch bei fehlgeschlagenen Tests.
      - name: Docker Compose stoppen
        if: always()
        run: ./scripts/local-stop.sh



      # --------------------------------------------------
      # 11. Docker Image bauen
      # --------------------------------------------------
      - name: Docker Image erstellen
        run: |
          docker build \
            -t pacman-app:${{ github.sha }} \
            -t pacman-app:latest .



      # --------------------------------------------------
      # 12. GHCR Login
      # --------------------------------------------------
      - name: Login bei GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}



      # --------------------------------------------------
      # 13. Docker Image veröffentlichen
      # --------------------------------------------------
      - name: Image nach GHCR pushen
        run: |
          docker tag pacman-app:${{ github.sha }} \
          ghcr.io/${{ github.repository }}/pacman-app:${{ github.sha }}

          docker push \
          ghcr.io/${{ github.repository }}/pacman-app:${{ github.sha }}



      # --------------------------------------------------
      # Abschluss
      # --------------------------------------------------
      - name: CI erfolgreich abgeschlossen
        run: echo "CI Pipeline erfolgreich ausgeführt."