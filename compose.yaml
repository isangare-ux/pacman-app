services:
  pacman:
    build: .
    image: pacman-app:v1.0
    ports:
      - "8080:8080"
      # - "8080:8090"

    environment:
      - MONGO_SERVICE_HOST=mongodb

    depends_on:
      mongodb:
        condition: service_healthy

    healthcheck:
      # node:22-alpine enthält kein curl, aber wget (Teil von BusyBox).
      test: ["CMD", "wget", "-qO-", "http://localhost:8080"]
      interval: 10s
      timeout: 10s
      retries: 3

  mongodb:
    image: mongo:4.4.30-focal
    #image: mongo:999.999
    container_name: mongodb

    # Port 27017 wird auf den Host freigegeben, damit npm test
    # (läuft auf dem Host, nicht im Container) MongoDB erreichen kann.
    ports:
      - "27017:27017"

    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
